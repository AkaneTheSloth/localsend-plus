name: Format Helper

# Temporary helper: produces the exact output of the `format` job in ci.yml for
# a single file, so it can be applied without guessing dart_style's line
# breaking. Delete after use.

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Remove gen directory (app)
        working-directory: app
        run: rm -rf lib/gen

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze lib/provider/network/send_provider.dart lib/provider/http_provider.dart lib/provider/network/server/controller/receive_controller.dart 2>&1 | tee /tmp/analyze.txt
          exit 0

      - name: dart format
        working-directory: app
        run: |
          dart --version
          dart format lib/provider/network/send_provider.dart lib/provider/http_provider.dart lib/provider/network/server/controller/receive_controller.dart

      - uses: actions/upload-artifact@v7
        with:
          name: formatted
          path: |
            app/lib/provider/network/send_provider.dart
            app/lib/provider/http_provider.dart
            app/lib/provider/network/server/controller/receive_controller.dart
