name: Compile APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Verify signing secrets are configured
        env:
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          missing=""
          [ -n "$KEY_PROPERTIES" ] || missing="$missing ANDROID_KEY_PROPERTIES"
          [ -n "$KEY_STORE" ] || missing="$missing ANDROID_KEY_STORE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Both secrets are required for release signing. Without them Gradle"
            echo "fails at :app:packageRelease with 'SigningConfig \"release\" is"
            echo "missing required property \"storeFile\"' after a full build."
            exit 1
          fi
          echo "Both signing secrets are present."

      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: printf '%s' "$ENCODED_STRING" | base64 -d > app/android/key.properties

      - name: Decode android-keystore.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir -p secrets && printf '%s' "$ENCODED_STRING" | base64 -d > secrets/android-keystore.jks

      - name: Validate decoded signing material
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          [ -s app/android/key.properties ] || { echo "::error::key.properties decoded to an empty file"; exit 1; }
          [ -s secrets/android-keystore.jks ] || { echo "::error::android-keystore.jks decoded to an empty file"; exit 1; }
          store_pass=$(sed -n 's/^storePassword=//p' app/android/key.properties)
          keytool -list -keystore secrets/android-keystore.jks -storepass "$store_pass" > /dev/null \
            || { echo "::error::keystore is corrupt or storePassword is wrong"; exit 1; }
          echo "Signing material decoded and verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
